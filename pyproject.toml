[project]
name = "chivalry2-unofficial-server-browser-backend"
version = "1.1.2"
description = "A server browser backend for unofficial chivalry2 servers. Keeps track of live servers with a heartbeat, and allows clients to list them. Probably usable for other unofficial gameservers."
authors = [{name = "Jacob Barber", email = "Jacoby6000@gmail.com"}]
license = {text = "GPL3"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "server-browser-api",
    "fastapi>=0.115,<1",
    "argparse>=1.4.0",
    "uvicorn>=0.34,<1",
    "pygelf>=0.4.2",
    "PyJWT[crypto]>=2.8.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "black>=23.3.0",
    "autoflake>=2.2.0",
    "mypy>=1.4.1",
    "isort>=5.12.0",
    "openapi-generator-cli==7.17.0",
    "pyyaml==6.0.3",
    "openapi-spec-validator==0.7.2",
    "types-pyyaml>=6.0.12.20261111",
    "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server_browser_backend"]

[tool.hatch.build.targets.wheel.force-include]
"assets/motd" = "server_browser_backend/assets/motd"

[tool.pytest.ini_options]
pythonpath = [ "src" ]

[tool.uv.workspace]
members = ["packages/server-browser-api"]

[tool.uv.sources]
server-browser-api = { workspace = true }

[tool.mypy]
mypy_path = "typings"
plugins = ["pydantic.mypy"]
