[project]
name = "server-browser-api"
version = "1.0.0"
description = "Generated server browser API contract and FastAPI bindings"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "openapi-schema-validator==0.6.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server_browser_api"]
