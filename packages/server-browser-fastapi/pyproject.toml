[project]
name = "server-browser-fastapi"
version = "1.0.0"
description = "Generated FastAPI adapter for server browser interfaces"
requires-python = ">=3.10"
dependencies = ["server-browser-server==1.0.0", "server-browser-models==1.0.0", "fastapi>=0.115,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server_browser_fastapi"]

[tool.uv.sources]
server-browser-server = { workspace = true }
server-browser-models = { workspace = true }
