[project]
name = "server-browser-models"
version = "1.0.0"
description = "Generated server browser models and authoritative contract"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.10,<3", "openapi-schema-validator==0.6.3"]

[build-system]
requires = ["hatchling", "PyYAML>=6,<7"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server_browser_models"]

[tool.hatch.build.targets.sdist]
exclude = ["src/server_browser_models/contract.json", "src/server_browser_models/openapi.yaml"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "hatch_build.py" },
    { file = "../../assets/chiv2-server-browser-api.yaml" },
    { file = "assets/chiv2-server-browser-api.yaml" },
]
