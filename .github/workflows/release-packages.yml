name: Attach SDK packages and contract to release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release_packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: dtolnay/rust-toolchain@1.93.0

      - name: Validate and build all packages
        run: ./ci.sh

      - name: Attach distributions and authoritative OpenAPI contract
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz sdk/rust/target/package/*.crate assets/chiv2-server-browser-api.yaml --repo "$GITHUB_REPOSITORY"
