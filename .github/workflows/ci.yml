name: CI

on: [push]

jobs:
  rust_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy, rustfmt
      - name: Check Rust formatting
        run: cargo fmt --manifest-path sdk/rust/Cargo.toml --all -- --check
      - name: Lint all targets and TLS features
        run: cargo clippy --locked --manifest-path sdk/rust/Cargo.toml --workspace --all-targets --all-features
      - name: Lint rustls without native TLS
        run: cargo clippy --locked --manifest-path sdk/rust/Cargo.toml --workspace --all-targets --no-default-features --features server-browser-client/rustls-tls,server-browser-client-sdk/rustls-tls
      - name: Check Rust documentation
        run: cargo doc --locked --manifest-path sdk/rust/Cargo.toml --workspace --all-features --no-deps
      - name: Test Rust debug builds
        run: cargo test --locked --manifest-path sdk/rust/Cargo.toml --workspace
      - name: Test Rust release builds
        run: cargo test --locked --manifest-path sdk/rust/Cargo.toml --workspace --release --all-features

  server_ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy, rustfmt

      - name: Validate and build all packages
        run: ./ci.sh

      - name: Upload SDK distributions and OpenAPI contract
        uses: actions/upload-artifact@v4
        with:
          name: sdk-distributions-and-contract
          path: |
            dist/*.whl
            dist/*.tar.gz
            sdk/rust/target/package/*.crate
            assets/chiv2-server-browser-api.yaml
          if-no-files-found: error
