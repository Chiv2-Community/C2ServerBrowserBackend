[tool.bumpversion]
current_version = "1.3.0-alpha.3"
parse = '(?P<major>0|[1-9]\d*)\.(?P<minor>0|[1-9]\d*)\.(?P<patch>0|[1-9]\d*)(?:-(?P<stage>alpha|beta|rc)\.(?P<number>0|[1-9]\d*))?(?:\+(?P<commit>[0-9a-f]+))?'
serialize = [
    "{major}.{minor}.{patch}-{stage}.{number}+{commit}",
    "{major}.{minor}.{patch}-{stage}.{number}",
    "{major}.{minor}.{patch}+{commit}",
    "{major}.{minor}.{patch}",
]
commit = false
tag = false

[tool.bumpversion.parts.stage]
values = ["alpha", "beta", "rc", "final"]
optional_value = "final"

[[tool.bumpversion.files]]
filename = "pyproject.toml"

[[tool.bumpversion.files]]
filename = "mock/pyproject.toml"

[[tool.bumpversion.files]]
glob = "sdk/python/*/pyproject.toml"

[[tool.bumpversion.files]]
filename = "sdk/rust/Cargo.toml"
