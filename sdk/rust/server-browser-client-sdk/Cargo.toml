[package]
name = "server-browser-client-sdk"
version.workspace = true
edition = "2021"
description = "Registration lifecycle SDK for the Chivalry 2 community server browser"
license = "GPL-3.0-only"
repository = "https://github.com/Chiv2-Community/C2ServerBrowserBackend"
readme = "README.md"
keywords = ["chivalry", "server-browser", "sdk"]
categories = ["api-bindings", "network-programming"]

[lints]
workspace = true

[dependencies]
server-browser-client = { workspace = true }
server-browser-models = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[features]
default = ["native-tls"]
native-tls = ["server-browser-client/native-tls", "reqwest/native-tls"]
rustls-tls = ["server-browser-client/rustls-tls", "reqwest/rustls-tls"]
