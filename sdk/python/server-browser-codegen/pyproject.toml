[project]
name = "server-browser-codegen"
version = "0.1.0"
description = "Pinned generation tooling and module-scoped templates for the server browser SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openapi-generator-cli==7.17.0",
    "PyYAML==6.0.3",
    "openapi-spec-validator==0.7.2",
]

[project.scripts]
server-browser-codegen = "server_browser_codegen.generation:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server_browser_codegen"]
