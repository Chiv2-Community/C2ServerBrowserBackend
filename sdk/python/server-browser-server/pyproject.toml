[project]
name = "server-browser-server"
version = "1.0.0"
description = "Generated framework-neutral server browser handler interfaces"
requires-python = ">=3.10"
dependencies = ["server-browser-models==1.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server_browser_server"]

[tool.uv.sources]
server-browser-models = { workspace = true }
