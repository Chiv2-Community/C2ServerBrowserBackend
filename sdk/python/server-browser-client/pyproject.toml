[project]
name = "server-browser-client"
version = "1.0.0"
description = "Generated synchronous and asynchronous server browser HTTPX clients"
requires-python = ">=3.10"
dependencies = ["server-browser-models==1.0.0", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server_browser_client"]

[tool.uv.sources]
server-browser-models = { workspace = true }
