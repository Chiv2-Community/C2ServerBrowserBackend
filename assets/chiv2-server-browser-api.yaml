          type: boolean
          description: Whether the IP is banned
    ErrorResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
          description: The status code
        message:
          type: string
          description: A human readable message about the error
        stack:
          type: string
          nullable: true
          description: Optional stack trace
    BanListResponse:
      type: object
      required:
        - banned_ips
      properties:
