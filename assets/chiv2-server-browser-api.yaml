        current_map:
          type: string
          maxLength: 256
          description: The current map being played on the server
        mods:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/Mod'
    Mod:
      type: object
      required:
        - name
        - organization
        - version
      properties:
        name:
          type: string
