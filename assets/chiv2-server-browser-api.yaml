    ServerListingItem:
      anyOf:
        - $ref: '#/components/schemas/ServerResponse'
        - $ref: '#/components/schemas/ServerResponseWithIP'
    ServerResponse:
      type: object
      required:
        - unique_id
        - ports
        - name
        - description
        - current_map
        - player_count
        - max_players
        - mods
        - password_protected
        - is_verified
        - last_heartbeat
      properties:
        unique_id:
          type: string
          description: The unique identifier of this server
        ports:
          $ref: '#/components/schemas/Chivalry2Ports'
        password_protected:
          type: boolean
          description: Whether the server is password protected
        is_verified:
          type: boolean
          description: Whether the server is verified
        name:
          type: string
          description: The name of the server
        description:
          type: string
          description: A description of the server
        current_map:
          type: string
          description: The current map being played on the server
        player_count:
          type: integer
          format: int32
          minimum: 0
          maximum: 1024
          description: The number of players currently on the server
        max_players:
          type: integer
          format: int32
          minimum: 0
          maximum: 1024
          description: The max number of players on the server
        mods:
          type: array
          items:
            $ref: '#/components/schemas/Mod'
          description: A list of mods running on the server
        last_heartbeat:
          type: number
          format: double
          description: Unix timestamp of registration or the last successful heartbeat or metadata update
    ServerResponseWithIP:
      x-python-parent:
        name: ServerResponse
        module: server_response
      allOf:
        - $ref: '#/components/schemas/ServerResponse'
        - type: object
          required:
            - ip_address
            - local_ip_address
          properties:
            ip_address:
              type: string
              format: ip-address
              description: Observed registration source; included when diagnostics are enabled
            local_ip_address:
              type: string
              format: ip-address
              nullable: true
              description: Advertised address; null if no address is registered
    ServerRegistrationRequest:
      type: object
      required:
        - ports
        - name
        - description
        - current_map
        - player_count
        - max_players
      properties:
        ports:
          $ref: '#/components/schemas/Chivalry2Ports'
        name:
          type: string
          maxLength: 256
          description: The name of the server
        description:
          type: string
          maxLength: 4096
          description: A description of the server
        current_map:
          type: string
          maxLength: 256
          description: The current map being played on the server
        player_count:
          type: integer
          format: int32
          minimum: 0
          maximum: 1024
          description: The number of players currently on the server
        max_players:
          type: integer
          format: int32
          minimum: 0
          maximum: 1024
          description: The max number of players on the server
        password_protected:
          type: boolean
          default: false
          description: Whether the server is password protected
        mods:
          type: array
          maxItems: 64
          default: []
          items:
            $ref: '#/components/schemas/Mod'
          description: A list of mods running on the server
        local_ip_address:
          type: string
          format: ip-address
          description: The local IP address of the server
    RegistrationResponse:
      type: object
      required:
        - key
        - refresh_before
        - server
      properties:
        key:
          type: string
          description: To be used as the X-CHIV2-SERVER-BROWSER-KEY header
        refresh_before:
          type: number
          format: double
          description: Unix timestamp for when the server should refresh its registration. Only present if operation was successful
        server:
          $ref: '#/components/schemas/ServerResponse'
    UpdateResponse:
      type: object
      required:
        - refresh_before
        - server
      properties:
        refresh_before:
          type: number
          format: double
          description: Unix timestamp for when the server should refresh its registration. Only present if operation was successful
        server:
          $ref: '#/components/schemas/ServerResponse'
    Chivalry2Ports:
      type: object
      required:
        - game
        - a2s
        - ping
      properties:
        game:
          type: integer
          format: int32
          description: The port number the server is running on
        a2s:
          type: integer
          format: int32
          description: The port number the server is responding to a2s requests at
        ping:
          type: integer
          format: int32
          description: The port number the server is accepting ping requests at
    StatusResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
          description: The status code
        message:
          type: string
          description: A human readable message about the status
        context:
          type: object
          additionalProperties: true
          nullable: true
          description: Optional context for the status
    BanStatusResponse:
      type: object
      required:
        - banned
      properties:
