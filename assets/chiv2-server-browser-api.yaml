          default: en
    MatchmakeRequest:
      type: object
      required: [LobbyId]
      properties:
        LobbyId:
          type: string
    LoginRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: The EOS ID token
    Jwk:
      type: object
      required:
        - kty
        - alg
        - use
        - kid
        - n
        - e
      properties:
        kty:
          type: string
        alg:
          type: string
        use:
          type: string
        kid:
          type: string
        n:
          type: string
        e:
          type: string
    JwksResponse:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/Jwk'
    JoinTicketClaims:
      description: Signed Discord identity for one live server registration. Not an OAuth or refresh credential.
      type: object
      required: [iss, sub, aud, purpose, auth_time, iat, nbf, exp, jti]
      properties:
        iss:
          type: string
          description: Fixed configured HTTPS issuer, compared exactly by validators.
        sub:
          type: string
          description: Verified Discord snowflake as a decimal string, not an engine/platform ID.
        aud:
          type: string
          description: '`urn:unchained:server:<registration UUID>`'
        purpose:
          type: string
          enum: [unchained.join]
        auth_time:
          type: integer
          format: int64
          description: Original Discord authentication time; refresh never advances it.
        iat:
          type: integer
          format: int64
        nbf:
          type: integer
          format: int64
        exp:
          type: integer
          format: int64
          description: At most 60 seconds after issuance.
        jti:
          type: string
          description: Single-use random UUID, consumed atomically by the game server.
